services:
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: frutas_db
    ports:
      - "5432:5432"
    networks:
      - fruit-basket

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - fruit-basket

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: [ "CMD", "kafka-topics", "--bootstrap-server=kafka:9092", "--list" ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - fruit-basket

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    depends_on:
      - kafka
    networks:
      - fruit-basket

  fruit:
    build:
      context: ./P_Quarkus_Fruit
      dockerfile: Dockerfile
    image: fruit-service:1.0
    container_name: fruit
    environment:
      QUARKUS_DATASOURCE_DB_KIND: postgresql
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/frutas_db

      QUARKUS_KAFKA_DEVSERVICES_ENABLED: "false"
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - kafka
    networks:
      - fruit-basket

  basket:
    build:
      context: ./P_Quarkus_Basket
      dockerfile: Dockerfile
    image: basket-service:1.0
    container_name: basket
    environment:
      QUARKUS_REST_CLIENT__ORG_CLIENT_FRUITCLIENT__URL: "http://fruit:8083"
      QUARKUS_KAFKA_DEVSERVICES_ENABLED: "false"
    ports:
      - "8082:8082"
    depends_on:
      - kafka
      - fruit
    networks:
      - fruit-basket

networks:
  fruit-basket:
    driver: bridge
